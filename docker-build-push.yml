.docker_build_push_template:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    ACR_LOGIN_SERVER: "acrbusesjalapa.azurecr.io"
    DOCKERFILE_PATH: "."
  script:
    - docker login $ACR_LOGIN_SERVER -u $ACR_USERNAME -p $ACR_PASSWORD
    - docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA -t $ACR_LOGIN_SERVER/$IMAGE_NAME:latest $DOCKERFILE_PATH
    - docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'