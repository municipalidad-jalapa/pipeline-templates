name: Validar YAML

# Reemplaza al job validar-yaml de GitLab CI: revisa que los workflows de este
# repo sean YAML valido y no tengan errores de sintaxis de GitHub Actions.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  actionlint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
