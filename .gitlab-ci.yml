stages:
  - validate

validar-yaml:
  stage: validate
  image: python:3.12-alpine
  script:
    - pip install --quiet pyyaml
    - |
      python3 <<'EOF'
      import glob
      import sys

      import yaml

      archivos = sorted(glob.glob('*.yml') + glob.glob('*.yaml'))
      if not archivos:
          print('No hay archivos YAML para validar')
          sys.exit(1)

      for archivo in archivos:
          with open(archivo) as f:
              yaml.safe_load(f)
          print(f'OK: {archivo}')
      EOF
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
